name: NEXUS Android Process Restart

on:
  pull_request:
    branches:
      - phase0-task0.20-final-ux-polish
      - phase0-task0.19-hil-controlled-field
      - phase0-task0.18-real-pixhawk-validation
      - phase0-task0.17-px4-validation
      - phase0-task0.16-crash-recovery
      - phase0-task0.15-security
      - develop
    paths:
      - 'custom/**'
      - '.github/workflows/nexus-android-process-restart.yml'
      - '.gitmodules'
      - 'qgroundcontrol'
  workflow_dispatch:

concurrency:
  group: nexus-process-restart-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: Release
  QT_ANDROID_ABIS: x86_64
  QGC_BASELINE_SHA: 25185047e855937d694a0174c1541d8f7d794a74
  NEXUS_PACKAGE: com.abitss.nexusgcs

jobs:
  process-restart:
    name: Android unclean process restart recovery
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          repository: mavlink/qgroundcontrol
          ref: ${{ env.QGC_BASELINE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: abitss/nexus-gcs
          ref: ${{ github.head_ref || github.ref_name }}
          path: nexus-overlay
          fetch-depth: 1
          persist-credentials: false

      - name: Stage NEXUS
        run: |
          rm -rf custom
          mkdir -p custom
          cp -a nexus-overlay/custom/. custom/

      - name: Set Android SDK location
        run: |
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"

      - id: setup
        uses: ./.github/actions/build-setup
        with:
          mode: android
          qt-host: linux
          qt-arch: linux_gcc_64
          abis: ${{ env.QT_ANDROID_ABIS }}
          build-type: ${{ env.BUILD_TYPE }}
          cache-key-suffix: nexus-process-restart
          cpm-modules: .cache/CPM

      - uses: ./.github/actions/install-dependencies

      - name: Create CI debug keystore
        shell: bash
        run: |
          keytool -genkey -v             -keystore "${RUNNER_TEMP}/debug.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=NEXUS Recovery CI,O=NEXUS,C=IN"
          {
            echo "QT_ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/debug.keystore"
            echo "QT_ANDROID_KEYSTORE_ALIAS=androiddebugkey"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=android"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=android"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/nexus-process-build
          source-dir: ${{ github.workspace }}
          build-type: ${{ env.BUILD_TYPE }}
          preset: Android
          use-qt-cmake: 'false'
          extra-args: >-
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup.outputs.target_qt_root_dir }}/lib/cmake/Qt6/qt.toolchain.cmake
            -DCMAKE_PREFIX_PATH=${{ steps.setup.outputs.target_qt_root_dir }}
            -DQT_ANDROID_ABIS=${{ env.QT_ANDROID_ABIS }}
            -DQT_HOST_PATH=${{ steps.setup.outputs.host_qt_root_dir }}
            -DQT_ANDROID_SIGN_APK=ON

      - uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/nexus-process-build
          build-type: ${{ env.BUILD_TYPE }}
          parallel-jobs: '2'
          output-file: nexus-process-build.log

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          apk="$(find "${RUNNER_TEMP}/nexus-process-build/android-build" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" "${RUNNER_TEMP}/NEXUS-GCS-process-restart.apk"
          echo "path=${RUNNER_TEMP}/NEXUS-GCS-process-restart.apk" >> "$GITHUB_OUTPUT"

      - name: Force process death and verify restart recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.setup.outputs.android_platform }}
          system-image-api-level: ${{ steps.setup.outputs.android_platform }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: nexus-recovery-ci
          force-avd-creation: true
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: |
            set -euo pipefail
            adb wait-for-device
            adb install -r "${{ steps.apk.outputs.path }}"
            adb logcat -c

            adb shell monkey -p "${NEXUS_PACKAGE}" -c android.intent.category.LAUNCHER 1
            sleep 15
            first_pid="$(adb shell pidof "${NEXUS_PACKAGE}" | tr -d '\r')"
            test -n "$first_pid"

            # force-stop does not run NEXUS aboutToQuit; persisted running=true must survive
            adb shell am force-stop "${NEXUS_PACKAGE}"
            sleep 3
            test -z "$(adb shell pidof "${NEXUS_PACKAGE}" | tr -d '\r')" || exit 1

            adb shell monkey -p "${NEXUS_PACKAGE}" -c android.intent.category.LAUNCHER 1
            sleep 15
            second_pid="$(adb shell pidof "${NEXUS_PACKAGE}" | tr -d '\r')"
            test -n "$second_pid"
            test "$first_pid" != "$second_pid"

            adb logcat -d -t 1200 > "${RUNNER_TEMP}/nexus-process-restart-logcat.txt"
            grep -F "NEXUS_RECOVERY APP_RESTART" "${RUNNER_TEMP}/nexus-process-restart-logcat.txt"

      - name: Upload process-restart evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nexus-process-restart-evidence
          path: |
            ${{ runner.temp }}/nexus-process-restart-logcat.txt
            ${{ runner.temp }}/nexus-process-build/nexus-process-build.log
          retention-days: 14
          if-no-files-found: warn
