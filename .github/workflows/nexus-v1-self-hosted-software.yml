name: NEXUS V1 Self-Hosted Software Gate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: Release
  QT_ANDROID_ABIS: arm64-v8a
  QGC_BASELINE_SHA: 25185047e855937d694a0174c1541d8f7d794a74

jobs:
  software-gate:
    runs-on: [self-hosted, linux, nexus-v1-software]
    timeout-minutes: 240

    steps:
      - name: Checkout pinned QGroundControl
        uses: actions/checkout@v7
        with:
          repository: mavlink/qgroundcontrol
          ref: ${{ env.QGC_BASELINE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout NEXUS source
        uses: actions/checkout@v7
        with:
          repository: abitss/nexus-gcs
          ref: ${{ github.ref_name }}
          path: nexus-overlay
          fetch-depth: 1
          persist-credentials: false

      - name: Run repository production preflight
        shell: bash
        run: |
          set -euo pipefail
          bash nexus-overlay/scripts/v1-production-preflight.sh nexus-overlay
          test "$(git rev-parse HEAD)" = "${QGC_BASELINE_SHA}"
          rm -rf custom
          mkdir -p custom
          cp -a nexus-overlay/custom/. custom/

      - name: Linux build setup
        id: linux_setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: Release
          cache-key-suffix: nexus-v1-self-hosted-linux
          cpm-modules: .cache/CPM

      - name: Install host dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure Linux V1 candidate
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/nexus-v1-linux
          source-dir: ${{ github.workspace }}
          build-type: Release
          preset: Linux
          extra-args: >-
            -DQGC_BUILD_TESTING=ON
            -DQGC_TEST_ONSCREEN=OFF
            -DNEXUS_SOURCE_SHA=${{ github.sha }}

      - name: Build Linux V1 candidate
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/nexus-v1-linux
          build-type: Release
          parallel-jobs: '2'
          output-file: nexus-v1-linux-build.log

      - name: Run core software regression suites
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: '1'
          QGC_TEST_MAXWARNINGS: '500'
        run: |
          set -euo pipefail
          BIN="${RUNNER_TEMP}/nexus-v1-linux/Release/NEXUS-GCS"
          run_test() {
            echo "=== $1 ==="
            "$BIN" --unittest:"$1" --allow-multiple 2>&1 | tee "${RUNNER_TEMP}/$1.log"
          }
          run_test NexusFlightCockpitUITest
          run_test NexusPlanEditingTest
          run_test NexusAlertManagerTest
          run_test NexusPreflightModelTest
          run_test NexusDeviceHealthModelTest
          run_test NexusSecurityModelTest
          run_test NexusRecoveryModelTest
          run_test NexusOfflineModelTest

      - name: Set Android SDK location
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"

      - name: Android build setup
        id: android_setup
        uses: ./.github/actions/build-setup
        with:
          mode: android
          qt-host: linux
          qt-arch: linux_gcc_64
          abis: ${{ env.QT_ANDROID_ABIS }}
          build-type: Release
          cache-key-suffix: nexus-v1-self-hosted-android
          cpm-modules: .cache/CPM

      - name: Create non-production CI signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkey -v             -keystore "${RUNNER_TEMP}/v1-ci.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=NEXUS V1 SELF-HOSTED CI,O=NEXUS,C=IN"
          {
            echo "QT_ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/v1-ci.keystore"
            echo "QT_ANDROID_KEYSTORE_ALIAS=androiddebugkey"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=android"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=android"
          } >> "$GITHUB_ENV"

      - name: Configure Android V1 candidate
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/nexus-v1-android
          source-dir: ${{ github.workspace }}
          build-type: Release
          preset: Android
          use-qt-cmake: 'false'
          extra-args: >-
            -DCMAKE_WARN_DEPRECATED=FALSE
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.android_setup.outputs.target_qt_root_dir }}/lib/cmake/Qt6/qt.toolchain.cmake
            -DCMAKE_PREFIX_PATH=${{ steps.android_setup.outputs.target_qt_root_dir }}
            -DQT_ANDROID_ABIS=${{ env.QT_ANDROID_ABIS }}
            -DQT_HOST_PATH=${{ steps.android_setup.outputs.host_qt_root_dir }}
            -DQT_ANDROID_SIGN_APK=ON
            -DNEXUS_SOURCE_SHA=${{ github.sha }}

      - name: Build Android V1 candidate
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/nexus-v1-android
          build-type: Release
          parallel-jobs: '2'
          output-file: nexus-v1-android-build.log

      - name: Package self-hosted evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/v1-software-evidence"
          cp "${RUNNER_TEMP}/nexus-v1-linux/nexus-v1-linux-build.log" "${RUNNER_TEMP}/v1-software-evidence/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/nexus-v1-android/nexus-v1-android-build.log" "${RUNNER_TEMP}/v1-software-evidence/" 2>/dev/null || true
          cp "${RUNNER_TEMP}"/Nexus*Test.log "${RUNNER_TEMP}/v1-software-evidence/" 2>/dev/null || true
          python3 - <<'PY'
          import json,os
          d={
            "schemaVersion":"1.0",
            "gate":"V1 SOFTWARE SELF-HOSTED",
            "sourceSha":os.environ["GITHUB_SHA"],
            "qgcBaseline":os.environ["QGC_BASELINE_SHA"],
            "linuxBuild":"attempted",
            "androidBuild":"PASS"
          }
          p=os.path.join(os.environ["RUNNER_TEMP"],"v1-software-evidence","nexus-v1-software-gate.json")
          open(p,"w").write(json.dumps(d,indent=2)+"\n")
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nexus-v1-self-hosted-software-evidence
          path: ${{ runner.temp }}/v1-software-evidence/
          retention-days: 30
          if-no-files-found: warn
