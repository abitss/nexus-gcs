name: NEXUS SECURITY Validation

on:
  pull_request:
    branches:
      - phase0-task0.14-device-health
      - phase0-task0.13-reports
      - develop
    paths:
      - 'custom/**'
      - 'scripts/scan-secrets.sh'
      - 'SECURITY.md'
      - '.gitignore'
      - '.github/workflows/nexus-security-validation.yml'
      - '.github/workflows/nexus-production-android.yml'
      - '.github/workflows/nexus-dependency-security.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: Release
  QGC_BASELINE_SHA: 25185047e855937d694a0174c1541d8f7d794a74

jobs:
  repository-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret and signing-material guard
        run: bash scripts/scan-secrets.sh .
      - name: Security architecture invariants
        shell: bash
        run: |
          grep -Fq 'QPasswordDigestor::deriveKeyPbkdf2' custom/src/NexusSecurityModel.cc
          grep -Fq 'kPbkdf2Iterations = 310000' custom/src/NexusSecurityModel.cc
          grep -Fq 'QFileDevice::ReadOwner | QFileDevice::WriteOwner' custom/src/NexusSecurityModel.cc
          grep -Fq 'PlanMasterController::kPlanFileType' custom/src/NexusSecurityModel.cc
          grep -Fq 'verifyUpdatePackage' custom/src/NexusSecurityModel.cc
          grep -Fq 'SECURITY_AUTHORIZED' custom/src/NexusEngineerModel.cc
          ! grep -Fq 'confirmation.trimmed().compare(QStringLiteral("ENGINEER")' custom/src/NexusEngineerModel.cc
          grep -Fq 'android:allowBackup="false"' custom/android/AndroidManifest.xml

  security-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          repository: mavlink/qgroundcontrol
          ref: ${{ env.QGC_BASELINE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: abitss/nexus-gcs
          ref: ${{ github.head_ref || github.ref_name }}
          path: nexus-overlay
          fetch-depth: 1
          persist-credentials: false
      - name: Stage NEXUS
        run: |
          rm -rf custom
          mkdir -p custom
          cp -a nexus-overlay/custom/. custom/
      - uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: ${{ env.BUILD_TYPE }}
          cache-key-suffix: nexus-security
          cpm-modules: .cache/CPM
      - uses: ./.github/actions/install-dependencies
      - uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/nexus-security-build
          source-dir: ${{ github.workspace }}
          build-type: ${{ env.BUILD_TYPE }}
          preset: Linux
          extra-args: -DQGC_BUILD_TESTING=ON -DQGC_TEST_ONSCREEN=OFF
      - uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/nexus-security-build
          build-type: ${{ env.BUILD_TYPE }}
          parallel-jobs: '2'
          output-file: nexus-security-build.log
      - name: Run security tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          "${RUNNER_TEMP}/nexus-security-build/Release/NEXUS-GCS" --unittest:NexusSecurityModelTest --allow-multiple
