name: NEXUS Android Emulator Smoke

on:
  pull_request:
    branches:
      - develop
      - phase0-task0.2-nexus-custom-foundation
      - phase0-task0.3-flight-cockpit
      - phase0-task0.4-plan-module
      - phase0-task0.5-health-module
      - phase0-task0.6-alerts-failsafes
      - phase0-task0.18-real-pixhawk-validation
      - phase0-task0.17-px4-validation
      - phase0-task0.16-crash-recovery
      - phase0-task0.15-security
      - phase0-task0.14-device-health
      - phase0-task0.13-reports
      - phase0-task0.12-analyze-module
      - phase0-task0.11-offline-first
      - phase0-task0.10-engineer-mode
      - phase0-task0.9-vehicle-module
      - phase0-task0.8-payload-video
      - phase0-task0.7-preflight-system
    paths:
      - 'custom/**'
      - '.github/workflows/nexus-android-emulator-smoke.yml'
      - '.gitmodules'
      - 'qgroundcontrol'
  workflow_dispatch:

concurrency:
  group: nexus-android-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: Release
  QT_ANDROID_ABIS: x86_64
  QGC_BASELINE_SHA: 25185047e855937d694a0174c1541d8f7d794a74
  NEXUS_PACKAGE: com.abitss.nexusgcs

jobs:
  emulator-smoke:
    name: Android x86_64 install + launch
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout pinned QGroundControl baseline
        uses: actions/checkout@v7
        with:
          repository: mavlink/qgroundcontrol
          ref: ${{ env.QGC_BASELINE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout NEXUS overlay
        uses: actions/checkout@v7
        with:
          repository: abitss/nexus-gcs
          ref: ${{ github.head_ref || github.ref_name }}
          path: nexus-overlay
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and stage NEXUS overlay
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Expected QGC: ${QGC_BASELINE_SHA}"
          echo "Actual QGC:   ${actual}"
          test "${actual}" = "${QGC_BASELINE_SHA}"

          rm -rf custom
          mkdir -p custom
          cp -a nexus-overlay/custom/. custom/

          test -f custom/CMakeLists.txt
          test -f custom/cmake/CustomOverrides.cmake
          test -f custom/src/NexusPlugin.cc
          test -f custom/android/AndroidManifest.xml

      - name: Set Android SDK location
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"

      - name: Build setup
        id: setup
        uses: ./.github/actions/build-setup
        with:
          mode: android
          qt-host: linux
          qt-arch: linux_gcc_64
          abis: ${{ env.QT_ANDROID_ABIS }}
          build-type: ${{ env.BUILD_TYPE }}
          cache-key-suffix: nexus-emulator
          cpm-modules: .cache/CPM

      - name: Install host build dependencies
        uses: ./.github/actions/install-dependencies

      - name: Create CI debug keystore
        shell: bash
        run: |
          keytool -genkey -v \
            -keystore "${RUNNER_TEMP}/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=NEXUS Emulator CI,O=NEXUS,C=IN"

          {
            echo "QT_ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/debug.keystore"
            echo "QT_ANDROID_KEYSTORE_ALIAS=androiddebugkey"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=android"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=android"
          } >> "$GITHUB_ENV"

      - name: Configure NEXUS x86_64 Android
        timeout-minutes: 15
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/nexus-emulator-build
          source-dir: ${{ github.workspace }}
          build-type: ${{ env.BUILD_TYPE }}
          preset: Android
          use-qt-cmake: 'false'
          extra-args: >-
            -DCMAKE_WARN_DEPRECATED=FALSE
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup.outputs.target_qt_root_dir }}/lib/cmake/Qt6/qt.toolchain.cmake
            -DCMAKE_PREFIX_PATH=${{ steps.setup.outputs.target_qt_root_dir }}
            -DQT_ANDROID_ABIS=${{ env.QT_ANDROID_ABIS }}
            -DQT_HOST_PATH=${{ steps.setup.outputs.host_qt_root_dir }}
            -DQT_ANDROID_SIGN_APK=ON

      - name: Build emulator APK
        id: build
        timeout-minutes: 75
        continue-on-error: true
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/nexus-emulator-build
          build-type: ${{ env.BUILD_TYPE }}
          parallel-jobs: '2'
          output-file: nexus-emulator-build.log

      - name: Retry emulator build if needed
        id: build-retry
        if: ${{ steps.build.outcome == 'failure' }}
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/android_build_retry.py" \
            --build-dir "${RUNNER_TEMP}/nexus-emulator-build" \
            --build-type "${BUILD_TYPE}"

      - name: Fail if emulator APK build did not recover
        if: ${{ steps.build.outcome == 'failure' && steps.build-retry.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::NEXUS emulator APK failed in both initial and retry builds."
          exit 1

      - name: Prepare emulator APK
        id: apk
        shell: bash
        run: |
          APK_DIR="${RUNNER_TEMP}/nexus-emulator-build/android-build"
          apk="$(find "${APK_DIR}" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "${apk}"
          cp "${apk}" "${RUNNER_TEMP}/NEXUS-GCS-emulator.apk"
          echo "path=${RUNNER_TEMP}/NEXUS-GCS-emulator.apk" >> "$GITHUB_OUTPUT"
          ls -lh "${RUNNER_TEMP}/NEXUS-GCS-emulator.apk"

      - name: Verify package id and launcher label
        shell: bash
        run: |
          AAPT2="$(find "${ANDROID_SDK_ROOT}/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          test -x "${AAPT2}"
          "${AAPT2}" dump badging "${{ steps.apk.outputs.path }}" | tee "${RUNNER_TEMP}/nexus-badging.txt"
          grep -F "package: name='${NEXUS_PACKAGE}'" "${RUNNER_TEMP}/nexus-badging.txt"
          grep -F "application-label:'NEXUS GCS'" "${RUNNER_TEMP}/nexus-badging.txt"

      - name: Reclaim disk for Android system image
        shell: bash
        run: |
          echo "Disk before cleanup:"
          df -h /

          cp "${RUNNER_TEMP}/nexus-emulator-build/nexus-emulator-build.log"              "${RUNNER_TEMP}/nexus-emulator-build.log" 2>/dev/null || true

          # The APK is already copied outside the build tree. The emulator smoke
          # test no longer needs Qt, the NDK, compiler cache, CPM cache or Gradle
          # build caches. Reclaim them before sdkmanager installs the system image.
          rm -rf "${RUNNER_TEMP}/nexus-emulator-build"
          rm -rf "${GITHUB_WORKSPACE}/.qt"
          rm -rf "${GITHUB_WORKSPACE}/.ccache"
          rm -rf "${GITHUB_WORKSPACE}/.cache/CPM"
          rm -rf "${ANDROID_SDK_ROOT}/ndk"
          rm -rf "${GRADLE_USER_HOME}/caches"
          rm -rf "${GRADLE_USER_HOME}/wrapper/dists"

          echo "Disk after cleanup:"
          df -h /

          available_kb="$(df --output=avail -k / | tail -1 | tr -d ' ')"
          min_kb=$((10 * 1024 * 1024))
          if [ "${available_kb}" -lt "${min_kb}" ]; then
            echo "::error::Less than 10 GiB free before Android emulator system-image install."
            exit 1
          fi

      - name: Android emulator boot test
        uses: ./.github/actions/android-emulator-test
        with:
          apk-path: ${{ steps.apk.outputs.path }}
          package: ${{ env.NEXUS_PACKAGE }}
          android-platform: ${{ steps.setup.outputs.android_platform }}
          diagnostics-name: nexus-gcs
          build-dir: ${{ runner.temp }}/nexus-emulator-build

      - name: Upload emulator APK
        uses: actions/upload-artifact@v7
        with:
          name: nexus-gcs-emulator-smoke-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nexus-emulator-build-diagnostics
          path: |
            ${{ runner.temp }}/nexus-emulator-build.log
            ${{ runner.temp }}/nexus-badging.txt
            ${{ runner.temp }}/nexus-emulator-evidence
          retention-days: 7
          if-no-files-found: ignore
