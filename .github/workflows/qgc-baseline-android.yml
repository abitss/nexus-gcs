name: QGC Baseline Android

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/qgc-baseline-android.yml'
      - '.gitmodules'
      - 'qgroundcontrol'
  workflow_dispatch:

concurrency:
  group: qgc-baseline-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  QGC_BASELINE_SHA: 25185047e855937d694a0174c1541d8f7d794a74
  BUILD_TYPE: Release
  PACKAGE: QGroundControl-Baseline
  QT_ANDROID_ABIS: arm64-v8a

jobs:
  android-baseline:
    name: Android arm64 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout pinned QGroundControl baseline
        uses: actions/checkout@v7
        with:
          repository: mavlink/qgroundcontrol
          ref: ${{ env.QGC_BASELINE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record baseline
        shell: bash
        run: |
          echo "Pinned QGroundControl commit: ${QGC_BASELINE_SHA}"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${QGC_BASELINE_SHA}"

      - name: Set Android SDK location
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"

      - name: Build setup
        id: setup
        uses: ./.github/actions/build-setup
        with:
          mode: android
          qt-host: linux
          qt-arch: linux_gcc_64
          abis: ${{ env.QT_ANDROID_ABIS }}
          build-type: ${{ env.BUILD_TYPE }}
          cache-key-suffix: nexus-baseline
          cpm-modules: .cache/CPM

      - name: Install host build dependencies
        uses: ./.github/actions/install-dependencies

      - name: Create CI debug keystore
        shell: bash
        run: |
          keytool -genkey -v \
            -keystore "${RUNNER_TEMP}/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=NEXUS CI,O=NEXUS,C=IN"

          {
            echo "QT_ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/debug.keystore"
            echo "QT_ANDROID_KEYSTORE_ALIAS=androiddebugkey"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=android"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=android"
          } >> "$GITHUB_ENV"

      - name: Configure Android baseline
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ env.BUILD_TYPE }}
          preset: Android
          use-qt-cmake: 'false'
          extra-args: >-
            -DCMAKE_WARN_DEPRECATED=FALSE
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup.outputs.target_qt_root_dir }}/lib/cmake/Qt6/qt.toolchain.cmake
            -DCMAKE_PREFIX_PATH=${{ steps.setup.outputs.target_qt_root_dir }}
            -DQT_ANDROID_ABIS=${{ env.QT_ANDROID_ABIS }}
            -DQT_HOST_PATH=${{ steps.setup.outputs.host_qt_root_dir }}
            -DQT_ANDROID_SIGN_APK=ON

      - name: Build Android baseline
        id: build
        timeout-minutes: 75
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ env.BUILD_TYPE }}
          output-file: qgc-baseline-build.log

      - name: Verify APK
        shell: bash
        run: |
          APK_DIR="${RUNNER_TEMP}/build/android-build"
          echo "APK directory: ${APK_DIR}"
          ls -lah "${APK_DIR}"
          test -n "$(find "${APK_DIR}" -maxdepth 1 -name '*.apk' -print -quit)"
          mkdir -p "${RUNNER_TEMP}/artifact"
          cp "${APK_DIR}"/*.apk "${RUNNER_TEMP}/artifact/NEXUS-QGC-baseline.apk"

      - name: Upload baseline APK
        uses: actions/upload-artifact@v7
        with:
          name: nexus-qgc-android-baseline
          path: ${{ runner.temp }}/artifact/NEXUS-QGC-baseline.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nexus-qgc-baseline-diagnostics
          path: |
            ${{ runner.temp }}/build/qgc-baseline-build.log
            ${{ runner.temp }}/build/CMakeFiles/CMakeOutput.log
            ${{ runner.temp }}/build/CMakeFiles/CMakeError.log
            ${{ runner.temp }}/build/android-QGroundControl-deployment-settings.json
          retention-days: 7
          if-no-files-found: ignore
