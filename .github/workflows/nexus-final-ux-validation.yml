name: NEXUS Final UX Validation

on:
  pull_request:
    branches:
      - phase0-task0.21-release-engineering
      - phase0-task0.20-final-ux-polish
      - phase0-task0.19-hil-controlled-field
      - phase0-task0.18-real-pixhawk-validation
      - develop
    paths:
      - 'custom/**'
      - 'scripts/validate-ux-polish.py'
      - '.github/workflows/nexus-final-ux-validation.yml'
  workflow_dispatch:

concurrency:
  group: nexus-final-ux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: Release
  QGC_BASELINE_SHA: 25185047e855937d694a0174c1541d8f7d794a74

jobs:
  ux-contract:
    name: UX contract + Linux QML compile
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          repository: mavlink/qgroundcontrol
          ref: ${{ env.QGC_BASELINE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: abitss/nexus-gcs
          ref: ${{ github.head_ref || github.ref_name }}
          path: nexus-overlay
          fetch-depth: 1
          persist-credentials: false

      - name: Validate UX contract
        run: python3 nexus-overlay/scripts/validate-ux-polish.py nexus-overlay

      - name: Stage NEXUS
        run: |
          rm -rf custom
          mkdir -p custom
          cp -a nexus-overlay/custom/. custom/

      - uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: ${{ env.BUILD_TYPE }}
          cache-key-suffix: nexus-final-ux
          cpm-modules: .cache/CPM

      - uses: ./.github/actions/install-dependencies

      - uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/nexus-final-ux-build
          source-dir: ${{ github.workspace }}
          build-type: ${{ env.BUILD_TYPE }}
          preset: Linux
          extra-args: -DQGC_BUILD_TESTING=ON -DQGC_TEST_ONSCREEN=OFF

      - uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/nexus-final-ux-build
          build-type: ${{ env.BUILD_TYPE }}
          parallel-jobs: '2'
          output-file: nexus-final-ux-build.log

      - name: Run cockpit UI regression
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          "${RUNNER_TEMP}/nexus-final-ux-build/Release/NEXUS-GCS"             --unittest:NexusFlightCockpitUITest             --allow-multiple             2>&1 | tee "${RUNNER_TEMP}/nexus-final-ux-test.log"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nexus-final-ux-evidence
          path: |
            ${{ runner.temp }}/nexus-final-ux-test.log
            ${{ runner.temp }}/nexus-final-ux-build/nexus-final-ux-build.log
          retention-days: 14
          if-no-files-found: warn
