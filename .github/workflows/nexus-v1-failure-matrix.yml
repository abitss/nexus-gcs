name: NEXUS V1 Failure Matrix

on:
  workflow_dispatch:
  pull_request:
    branches:
      - phase0-task0.21-release-engineering
      - develop
    paths:
      - 'custom/**'
      - '.github/workflows/nexus-v1-failure-matrix.yml'
      - 'scripts/**'

concurrency:
  group: nexus-v1-failure-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: Release
  QGC_BASELINE_SHA: 25185047e855937d694a0174c1541d8f7d794a74

jobs:
  failure-matrix:
    name: Failure matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          repository: mavlink/qgroundcontrol
          ref: ${{ env.QGC_BASELINE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: abitss/nexus-gcs
          ref: ${{ github.head_ref || github.ref_name }}
          path: nexus-overlay
          fetch-depth: 1
          persist-credentials: false

      - name: Stage NEXUS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${QGC_BASELINE_SHA}"
          rm -rf custom
          mkdir -p custom
          cp -a nexus-overlay/custom/. custom/

      - uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: ${{ env.BUILD_TYPE }}
          cache-key-suffix: nexus-v1-failure-matrix
          cpm-modules: .cache/CPM
      - uses: ./.github/actions/install-dependencies
      - uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/nexus-v1-failure-build
          source-dir: ${{ github.workspace }}
          build-type: ${{ env.BUILD_TYPE }}
          preset: Linux
          extra-args: -DQGC_BUILD_TESTING=ON -DQGC_TEST_ONSCREEN=OFF
      - uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/nexus-v1-failure-build
          build-type: ${{ env.BUILD_TYPE }}
          parallel-jobs: '2'
          output-file: nexus-v1-failure-build.log

      - name: Run failure matrix
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: '1'
          QGC_TEST_MAXWARNINGS: '500'
        run: |
          set -euo pipefail
          BIN="${RUNNER_TEMP}/nexus-v1-failure-build/Release/NEXUS-GCS"
          EVID="${RUNNER_TEMP}/nexus-v1-failure-matrix.json"
          echo '{"schemaVersion":"1.0","suite":"NEXUS V1 FAILURE MATRIX","stages":[]}' > "$EVID"
          run_test() {
            local name="$1"
            echo "=== $name ==="
            "$BIN" --unittest:"$name" --allow-multiple 2>&1 | tee "${RUNNER_TEMP}/${name}.log"
            python3 - "$EVID" "$name" <<'PY'
          import json,sys
          p,name=sys.argv[1],sys.argv[2]
          d=json.load(open(p))
          d["stages"].append({"name":name,"status":"PASS"})
          open(p,"w").write(json.dumps(d,indent=2)+"\n")
          PY
          }
          run_test NexusPlanEditingTest
          run_test NexusAlertManagerTest
          run_test NexusPreflightModelTest
          run_test NexusDeviceHealthModelTest
          run_test NexusSecurityModelTest
          run_test NexusRecoveryModelTest
          run_test NexusOfflineModelTest
          python3 - "$EVID" <<'PY'
          import json,sys
          p=sys.argv[1]
          d=json.load(open(p))
          d["qualification"]="PASS"
          open(p,"w").write(json.dumps(d,indent=2)+"\n")
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nexus-v1-failure-matrix-evidence
          path: |
            ${{ runner.temp }}/nexus-v1-failure-matrix.json
            ${{ runner.temp }}/Nexus*Test.log
            ${{ runner.temp }}/nexus-v1-failure-build/nexus-v1-failure-build.log
          retention-days: 30
          if-no-files-found: warn
