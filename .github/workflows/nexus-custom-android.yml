name: NEXUS Custom Android

on:
  push:
    branches:
      - release/v1-operational-acceptance
    paths:
      - 'custom/**'
      - 'scripts/stage-custom.sh'
      - '.github/workflows/nexus-custom-android.yml'
      - '.gitmodules'
      - 'qgroundcontrol'
  pull_request:
    branches:
      - develop
      - phase0-task0.2-nexus-custom-foundation
      - phase0-task0.3-flight-cockpit
      - phase0-task0.4-plan-module
      - phase0-task0.5-health-module
      - phase0-task0.6-alerts-failsafes
      - phase0-task0.21-release-engineering
      - phase0-task0.20-final-ux-polish
      - phase0-task0.19-hil-controlled-field
      - phase0-task0.18-real-pixhawk-validation
      - phase0-task0.17-px4-validation
      - phase0-task0.16-crash-recovery
      - phase0-task0.15-security
      - phase0-task0.14-device-health
      - phase0-task0.13-reports
      - phase0-task0.12-analyze-module
      - phase0-task0.11-offline-first
      - phase0-task0.10-engineer-mode
      - phase0-task0.9-vehicle-module
      - phase0-task0.8-payload-video
      - phase0-task0.7-preflight-system
    paths:
      - 'custom/**'
      - 'scripts/stage-custom.sh'
      - '.github/workflows/nexus-custom-android.yml'
      - '.gitmodules'
      - 'qgroundcontrol'
  workflow_dispatch:

concurrency:
  group: nexus-custom-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: Release
  QT_ANDROID_ABIS: arm64-v8a
  QGC_BASELINE_SHA: 25185047e855937d694a0174c1541d8f7d794a74

jobs:
  android-custom-build:
    name: NEXUS Android arm64 (CI debug-signed)
    runs-on: [self-hosted, linux, nexus-v1-software]
    timeout-minutes: 120

    steps:
      - name: Checkout pinned QGroundControl baseline
        uses: actions/checkout@v7
        with:
          repository: mavlink/qgroundcontrol
          ref: ${{ env.QGC_BASELINE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout NEXUS overlay
        uses: actions/checkout@v7
        with:
          repository: abitss/nexus-gcs
          ref: ${{ github.head_ref || github.ref_name }}
          path: nexus-overlay
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned QGC baseline
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Expected QGC: ${QGC_BASELINE_SHA}"
          echo "Actual QGC:   ${actual}"
          test "${actual}" = "${QGC_BASELINE_SHA}"

      - name: Stage NEXUS custom overlay
        shell: bash
        run: |
          rm -rf custom
          mkdir -p custom
          cp -a nexus-overlay/custom/. custom/
          test -f custom/CMakeLists.txt
          test -f custom/cmake/CustomOverrides.cmake
          test -f custom/src/NexusPlugin.cc

      - name: Set Android SDK location
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"

      - name: Verify self-hosted runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v unzip
          unzip -v >/dev/null

      - name: Build prerequisites (Android only)
        id: prereq
        uses: ./.github/actions/build-prerequisites
        with:
          mode: android
          build-type: ${{ env.BUILD_TYPE }}

      - name: Setup Gradle (Android only)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Install Qt for Android only
        id: setup
        uses: ./.github/actions/qt-android
        with:
          host: linux
          arch: linux_gcc_64
          version: ${{ steps.prereq.outputs.qt_version }}
          modules: ${{ steps.prereq.outputs.qt_modules }}
          abis: ${{ env.QT_ANDROID_ABIS }}
          cpm-modules: .cache/CPM
          build-type: ${{ env.BUILD_TYPE }}
          ndk-full-version: ${{ steps.prereq.outputs.android_ndk_full_version }}
          java-version: ${{ steps.prereq.outputs.android_java_version }}
          android-platform: ${{ steps.prereq.outputs.android_platform }}
          android-cmdline-tools: ${{ steps.prereq.outputs.android_cmdline_tools }}
          android-build-tools: ${{ steps.prereq.outputs.android_build_tools }}
          cache-key-suffix: nexus-custom

      - name: Patch Ubuntu 26.04 GStreamer dependency name
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          pkg_file="tools/setup/install_dependencies/_packages.py"
          if grep -q "libgstreamer-plugins-good1.0-dev" "$pkg_file"; then
            sed -i 's/libgstreamer-plugins-good1\.0-dev/libgstreamer-plugins-extra1.0-dev/g' "$pkg_file"
          fi
          grep -n "libgstreamer-plugins-extra1.0-dev" "$pkg_file"

      - name: Verify pre-provisioned host build dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v ccache
          command -v mold
          command -v cmake
          command -v ninja
          command -v pkg-config
          command -v git
          command -v python3


      - name: Create CI debug keystore
        shell: bash
        run: |
          keytool -genkey -v \
            -keystore "${RUNNER_TEMP}/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=NEXUS CI,O=NEXUS,C=IN"

          {
            echo "QT_ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/debug.keystore"
            echo "QT_ANDROID_KEYSTORE_ALIAS=androiddebugkey"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=android"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=android"
          } >> "$GITHUB_ENV"

      - name: Pre-seed pinned Android OpenSSL helper
        shell: bash
        run: |
          set -euo pipefail

          rev="b71f1470962019bd89534a2919f5925f93bc5779"
          work="${RUNNER_TEMP}/android-openssl-src"
          cache="${GITHUB_WORKSPACE}/.cache/CPM/android_openssl"
          archive="${cache}/android_openssl-${rev}.zip"

          rm -rf "${work}"
          mkdir -p "${work}" "${cache}"

          git -C "${work}" init
          git -C "${work}" remote add origin https://github.com/KDAB/android_openssl.git
          git -C "${work}" fetch --depth=1 origin "${rev}"
          git -C "${work}" archive \
            --format=zip \
            --prefix="android_openssl-${rev}/" \
            --output="${archive}" \
            FETCH_HEAD

          hash="$(sha256sum "${archive}" | awk '{print $1}')"
          echo "Locally seeded Android OpenSSL helper: ${archive}"
          echo "SHA256=${hash}"

          python3 - "${hash}" <<'PY'
          from pathlib import Path
          import re
          import sys

          new_hash = sys.argv[1]
          path = Path("cmake/modules/AndroidOpenSSL.cmake")
          text = path.read_text(encoding="utf-8")
          text, count = re.subn(
              r'set\(_android_openssl_hash SHA256=[0-9a-f]{64}\)',
              f'set(_android_openssl_hash SHA256={new_hash})',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not patch Android OpenSSL helper archive hash")
          path.write_text(text, encoding="utf-8")
          PY

          test -s "${archive}"
      - name: Configure NEXUS Android
        timeout-minutes: 90
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/nexus-build
          source-dir: ${{ github.workspace }}
          build-type: ${{ env.BUILD_TYPE }}
          preset: Android
          use-qt-cmake: 'false'
          extra-args: >-
            -DCMAKE_WARN_DEPRECATED=FALSE
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup.outputs.target_qt_root_dir }}/lib/cmake/Qt6/qt.toolchain.cmake
            -DCMAKE_PREFIX_PATH=${{ steps.setup.outputs.target_qt_root_dir }}
            -DQT_ANDROID_ABIS=${{ env.QT_ANDROID_ABIS }}
            -DQT_HOST_PATH=${{ steps.setup.outputs.host_qt_root_dir }}
            -DQT_ANDROID_SIGN_APK=ON
            -DNEXUS_SOURCE_SHA=${{ github.sha }}
            -DQGC_ENABLE_GST_VIDEOSTREAMING=OFF

      - name: Build NEXUS Android
        timeout-minutes: 75
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/nexus-build
          build-type: ${{ env.BUILD_TYPE }}
          output-file: nexus-build.log

      - name: Verify NEXUS APK
        shell: bash
        run: |
          APK_DIR="${RUNNER_TEMP}/nexus-build/android-build"
          ls -lah "${APK_DIR}"
          apk="$(find "${APK_DIR}" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "${apk}"
          mkdir -p "${RUNNER_TEMP}/artifact"
          cp "${apk}" "${RUNNER_TEMP}/artifact/NEXUS-GCS-PREVIEW-no-gstreamer-arm64.apk"

      - name: Upload NEXUS APK
        uses: actions/upload-artifact@v7
        with:
          name: nexus-gcs-preview-no-gstreamer-android
          path: ${{ runner.temp }}/artifact/NEXUS-GCS-PREVIEW-no-gstreamer-arm64.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nexus-custom-build-diagnostics
          path: |
            ${{ runner.temp }}/nexus-build/nexus-build.log
            ${{ runner.temp }}/nexus-build/CMakeFiles/CMakeOutput.log
            ${{ runner.temp }}/nexus-build/CMakeFiles/CMakeError.log
          retention-days: 7
          if-no-files-found: ignore
