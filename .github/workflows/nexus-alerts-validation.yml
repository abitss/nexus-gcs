name: NEXUS Alerts Validation

on:
  pull_request:
    branches:
      - phase0-task0.5-health-module
      - phase0-task0.6-alerts-failsafes
      - phase0-task0.18-real-pixhawk-validation
      - phase0-task0.17-px4-validation
      - phase0-task0.16-crash-recovery
      - phase0-task0.15-security
      - phase0-task0.14-device-health
      - phase0-task0.13-reports
      - phase0-task0.12-analyze-module
      - phase0-task0.11-offline-first
      - phase0-task0.10-engineer-mode
      - phase0-task0.9-vehicle-module
      - phase0-task0.8-payload-video
      - phase0-task0.7-preflight-system
      - phase0-task0.4-plan-module
      - develop
    paths:
      - 'custom/**'
      - '.github/workflows/nexus-alerts-validation.yml'
      - '.gitmodules'
      - 'qgroundcontrol'
  workflow_dispatch:

concurrency:
  group: nexus-alerts-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: Release
  QGC_BASELINE_SHA: 25185047e855937d694a0174c1541d8f7d794a74

jobs:
  alerts-validation:
    name: Alerts + failsafes integration
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout pinned QGroundControl
        uses: actions/checkout@v7
        with:
          repository: mavlink/qgroundcontrol
          ref: ${{ env.QGC_BASELINE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout NEXUS overlay
        uses: actions/checkout@v7
        with:
          repository: abitss/nexus-gcs
          ref: ${{ github.head_ref || github.ref_name }}
          path: nexus-overlay
          fetch-depth: 1
          persist-credentials: false

      - name: Stage NEXUS custom build
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${QGC_BASELINE_SHA}"
          rm -rf custom
          mkdir -p custom
          cp -a nexus-overlay/custom/. custom/

      - name: Build setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: ${{ env.BUILD_TYPE }}
          cache-key-suffix: nexus-alerts-validation
          cpm-modules: .cache/CPM

      - name: Install QGC dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure NEXUS tests
        timeout-minutes: 20
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/nexus-alerts-build
          source-dir: ${{ github.workspace }}
          build-type: ${{ env.BUILD_TYPE }}
          preset: Linux
          extra-args: >-
            -DQGC_BUILD_TESTING=ON
            -DQGC_TEST_ONSCREEN=OFF

      - name: Build NEXUS test binary
        timeout-minutes: 75
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/nexus-alerts-build
          build-type: ${{ env.BUILD_TYPE }}
          parallel-jobs: '2'
          output-file: nexus-alerts-build.log

      - name: Run alerts/failsafes tests
        timeout-minutes: 10
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: '1'
          QGC_TEST_MAXWARNINGS: '250'
        run: |
          "${RUNNER_TEMP}/nexus-alerts-build/Release/NEXUS-GCS"             --unittest:NexusAlertManagerTest             --allow-multiple             2>&1 | tee "${RUNNER_TEMP}/nexus-alerts-test.log"

      - name: Upload alerts validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nexus-alerts-validation-evidence
          path: |
            ${{ runner.temp }}/nexus-alerts-test.log
            ${{ runner.temp }}/nexus-alerts-build/nexus-alerts-build.log
          retention-days: 14
          if-no-files-found: warn
