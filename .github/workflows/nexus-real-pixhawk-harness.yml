name: NEXUS Real Pixhawk Harness Validation

on:
  pull_request:
    branches:
      - phase0-task0.18-real-pixhawk-validation
      - phase0-task0.17-px4-validation
      - phase0-task0.16-crash-recovery
      - develop
    paths:
      - 'custom/**'
      - 'docs/REAL_PIXHAWK_QUALIFICATION.md'
      - 'scripts/validate-real-pixhawk.sh'
      - '.github/workflows/nexus-real-pixhawk-harness.yml'
      - '.github/workflows/nexus-real-pixhawk-bench.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: Release
  QGC_BASELINE_SHA: 25185047e855937d694a0174c1541d8f7d794a74

jobs:
  harness:
    name: Real Pixhawk harness compile + safety contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          repository: mavlink/qgroundcontrol
          ref: ${{ env.QGC_BASELINE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: abitss/nexus-gcs
          ref: ${{ github.head_ref || github.ref_name }}
          path: nexus-overlay
          fetch-depth: 1
          persist-credentials: false

      - name: Validate real-hardware safety contract
        shell: bash
        run: |
          bash nexus-overlay/scripts/validate-real-pixhawk.sh             nexus-overlay/custom/test/NexusRealPixhawkBenchTest.cc             nexus-overlay/docs/REAL_PIXHAWK_QUALIFICATION.md             nexus-overlay/.github/workflows/nexus-real-pixhawk-bench.yml
          rm -rf custom
          mkdir -p custom
          cp -a nexus-overlay/custom/. custom/

      - uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: ${{ env.BUILD_TYPE }}
          cache-key-suffix: nexus-real-pixhawk-harness
          cpm-modules: .cache/CPM

      - uses: ./.github/actions/install-dependencies

      - uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/nexus-real-pixhawk-build
          source-dir: ${{ github.workspace }}
          build-type: ${{ env.BUILD_TYPE }}
          preset: Linux
          extra-args: >-
            -DQGC_BUILD_TESTING=ON
            -DQGC_TEST_ONSCREEN=OFF

      - uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/nexus-real-pixhawk-build
          build-type: ${{ env.BUILD_TYPE }}
          parallel-jobs: '2'
          output-file: nexus-real-pixhawk-harness-build.log

      - name: Verify hardware test refuses cloud execution
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        shell: bash
        run: |
          set -o pipefail
          "${RUNNER_TEMP}/nexus-real-pixhawk-build/Release/NEXUS-GCS"             --unittest:NexusRealPixhawkBenchTest             --allow-multiple             2>&1 | tee "${RUNNER_TEMP}/nexus-real-pixhawk-harness.log"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nexus-real-pixhawk-harness-evidence
          path: |
            ${{ runner.temp }}/nexus-real-pixhawk-harness.log
            ${{ runner.temp }}/nexus-real-pixhawk-build/nexus-real-pixhawk-harness-build.log
          retention-days: 14
          if-no-files-found: warn
