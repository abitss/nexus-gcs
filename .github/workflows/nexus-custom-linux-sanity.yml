name: NEXUS Custom Linux Sanity

on:
  pull_request:
    branches:
      - develop
      - phase0-task0.2-nexus-custom-foundation
    paths:
      - 'custom/**'
      - '.github/workflows/nexus-custom-linux-sanity.yml'
      - '.gitmodules'
      - 'qgroundcontrol'
  workflow_dispatch:

concurrency:
  group: nexus-custom-linux-sanity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: Release
  QGC_BASELINE_SHA: 25185047e855937d694a0174c1541d8f7d794a74

jobs:
  linux-sanity:
    name: Linux custom compile sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout pinned QGroundControl baseline
        uses: actions/checkout@v7
        with:
          repository: mavlink/qgroundcontrol
          ref: ${{ env.QGC_BASELINE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout NEXUS overlay
        uses: actions/checkout@v7
        with:
          repository: abitss/nexus-gcs
          ref: ${{ github.head_ref || github.ref_name }}
          path: nexus-overlay
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and stage NEXUS overlay
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${QGC_BASELINE_SHA}"
          rm -rf custom
          mkdir -p custom
          cp -a nexus-overlay/custom/. custom/
          test -f custom/CMakeLists.txt
          test -f custom/cmake/CustomOverrides.cmake
          test -f custom/src/NexusPlugin.cc

      - name: Validate Flight cockpit architecture
        shell: bash
        run: bash nexus-overlay/scripts/validate-flight-cockpit.sh nexus-overlay/custom/src/FlyViewCustomLayer.qml

      - name: Build setup
        id: setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: ${{ env.BUILD_TYPE }}
          cache-key-suffix: nexus-linux-sanity
          cpm-modules: .cache/CPM

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure
        timeout-minutes: 15
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/nexus-linux-build
          source-dir: ${{ github.workspace }}
          build-type: ${{ env.BUILD_TYPE }}
          preset: Linux

      - name: Build
        timeout-minutes: 60
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/nexus-linux-build
          build-type: ${{ env.BUILD_TYPE }}
          output-file: nexus-linux-build.log

      - name: Verify executable
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/nexus-linux-build/Release/NEXUS-GCS

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nexus-linux-sanity-diagnostics
          path: |
            ${{ runner.temp }}/nexus-linux-build/nexus-linux-build.log
            ${{ runner.temp }}/nexus-linux-build/CMakeFiles/CMakeOutput.log
            ${{ runner.temp }}/nexus-linux-build/CMakeFiles/CMakeError.log
          retention-days: 7
          if-no-files-found: ignore
