name: NEXUS Production Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  QT_ANDROID_ABIS: arm64-v8a
  QGC_BASELINE_SHA: 25185047e855937d694a0174c1541d8f7d794a74

jobs:
  production-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - name: Require protected signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.NEXUS_ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.NEXUS_ANDROID_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.NEXUS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.NEXUS_ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.NEXUS_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEY_ALIAS"
          test -n "$STORE_PASS"
          test -n "$KEY_PASS"
          test -n "$CERT_SHA256"

      - uses: actions/checkout@v7
        with:
          repository: mavlink/qgroundcontrol
          ref: ${{ env.QGC_BASELINE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: abitss/nexus-gcs
          ref: ${{ github.ref_name }}
          path: nexus-overlay
          fetch-depth: 1
          persist-credentials: false

      - name: Stage NEXUS and scan repository
        run: |
          bash nexus-overlay/scripts/scan-secrets.sh nexus-overlay
          rm -rf custom
          mkdir -p custom
          cp -a nexus-overlay/custom/. custom/

      - name: Materialize production keystore
        env:
          KEYSTORE_B64: ${{ secrets.NEXUS_ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.NEXUS_ANDROID_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.NEXUS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.NEXUS_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/nexus-release.keystore"
          chmod 600 "${RUNNER_TEMP}/nexus-release.keystore"
          {
            echo "QT_ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/nexus-release.keystore"
            echo "QT_ANDROID_KEYSTORE_ALIAS=$KEY_ALIAS"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$STORE_PASS"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Set Android SDK location
        run: |
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"

      - id: setup
        uses: ./.github/actions/build-setup
        with:
          mode: android
          qt-host: linux
          qt-arch: linux_gcc_64
          abis: ${{ env.QT_ANDROID_ABIS }}
          build-type: ${{ env.BUILD_TYPE }}
          cache-key-suffix: nexus-production
          cpm-modules: .cache/CPM
      - uses: ./.github/actions/install-dependencies

      - uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/nexus-production-build
          source-dir: ${{ github.workspace }}
          build-type: ${{ env.BUILD_TYPE }}
          preset: Android
          use-qt-cmake: 'false'
          extra-args: >-
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup.outputs.target_qt_root_dir }}/lib/cmake/Qt6/qt.toolchain.cmake
            -DCMAKE_PREFIX_PATH=${{ steps.setup.outputs.target_qt_root_dir }}
            -DQT_ANDROID_ABIS=${{ env.QT_ANDROID_ABIS }}
            -DQT_HOST_PATH=${{ steps.setup.outputs.host_qt_root_dir }}
            -DQT_ANDROID_SIGN_APK=ON

      - uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/nexus-production-build
          build-type: ${{ env.BUILD_TYPE }}
          parallel-jobs: '2'
          output-file: nexus-production-build.log

      - name: Verify release signer and generate integrity manifest
        env:
          CERT_SHA256: ${{ secrets.NEXUS_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find "${RUNNER_TEMP}/nexus-production-build/android-build" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          apksigner_bin="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -x "$apksigner_bin"
          "$apksigner_bin" verify --verbose --print-certs "$apk" | tee "${RUNNER_TEMP}/apksigner.txt"
          actual="$(grep -i 'Signer #1 certificate SHA-256 digest:' "${RUNNER_TEMP}/apksigner.txt" | head -1 | cut -d: -f2- | tr -d ' :\r\n' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$CERT_SHA256" | tr -d ' :\r\n' | tr '[:lower:]' '[:upper:]')"
          test -n "$actual"
          test "$actual" = "$expected"

          mkdir -p "${RUNNER_TEMP}/release"
          cp "$apk" "${RUNNER_TEMP}/release/NEXUS-GCS-${{ inputs.version }}.apk"
          (
            cd "${RUNNER_TEMP}/release"
            sha256sum "NEXUS-GCS-${{ inputs.version }}.apk" > SHA256SUMS.txt
          )
          printf 'version=%s\nsigner_sha256=%s\n' "${{ inputs.version }}" "$actual" > "${RUNNER_TEMP}/release/RELEASE-IDENTITY.txt"

      - name: Destroy signing material
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/nexus-release.keystore"
          {
            echo "QT_ANDROID_KEYSTORE_PATH="
            echo "QT_ANDROID_KEYSTORE_ALIAS="
            echo "QT_ANDROID_KEYSTORE_STORE_PASS="
            echo "QT_ANDROID_KEYSTORE_KEY_PASS="
          } >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: nexus-production-${{ inputs.version }}
          path: ${{ runner.temp }}/release/
          retention-days: 30
          if-no-files-found: error
